
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>财经数据公告</title>
        <style>
            body {
                background-color: #1a1a24;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .data-card {
                background-color: #222531;
                border: 1px solid #2f3548;
                padding: 24px 36px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.5);
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .data-text {
                font-size: 24px;
                font-weight: 600;
                color: #f1f5f9;
                letter-spacing: 0.5px;
            }
            .highlight {
                color: #fbbf24;
            }
            .tag-bearish {
                background-color: rgba(239, 68, 68, 0.2);
                color: #ef4444;
                border: 2px solid #ef4444;
                padding: 6px 16px;
                border-radius: 8px;
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <div class="data-card">
            <div class="data-text">
                已公布：<span class="highlight">2.7%</span> （预期 <span class="highlight">2.6%</span>）
            </div>
            <div class="tag-bearish">【利空】</div>
        </div>
    </body>
    </html>
